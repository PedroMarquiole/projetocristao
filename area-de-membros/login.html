<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFC933">
  <!-- Título e meta tags são preenchidos por js/app.js a partir de PRODUTO (js/config.js). -->
  <title>Entrar</title>
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:site_name" content="">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=744a56b3">
</head>
<body data-titulo="Entrar">
  <main class="login">
    <div class="login__caixa">
      <div class="marca login__marca">
        <img class="marca__logo" src="img/logo.svg" width="44" height="44" alt="">
        <span class="marca__nome" data-produto-nome></span>
      </div>
      <h1 class="login__titulo">Que bom ter você aqui!</h1>
      <p class="login__texto" id="login-msg" role="status">Conferindo seu acesso…</p>

      <div id="login-sem-acesso" hidden>
        <p class="login__texto">Para entrar, use o <b>link de acesso</b> que aparece na página de confirmação da compra. Ele fica salvo neste aparelho.</p>
        <a class="btn btn--azul btn--bloco" href="/">Quero comprar</a>
        <p class="login__ajuda">Já comprou e perdeu o link? Fale com o suporte.</p>
      </div>

      <p class="login__ajuda" data-produto-slogan></p>
    </div>
  </main>

  <script src="js/config.js?v=e964f2d2"></script>
  <script src="js/app.js?v=368c16b3"></script>
</body>
</html>
